# =============================================================================
# CareerOS — Docker Compose Profile (shared across all microservices)
# Override application.yml defaults when running inside Docker
# =============================================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:careeros_auth}
    username: ${DB_USER:careeros}
    password: ${DB_PASSWORD:careeros_secret}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          min-idle: 2

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${spring.application.name}-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:careeros}
    password: ${RABBITMQ_PASSWORD:careeros_rabbit}
    virtual-host: /

  cloud:
    config:
      uri: http://${CONFIG_SERVER_HOST:config-server}:${CONFIG_SERVER_PORT:8888}
      fail-fast: true
      retry:
        max-attempts: 5
        initial-interval: 2000
        max-interval: 10000
        multiplier: 1.5

    loadbalancer:
      ribbon:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:careeros@careeros.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:service-registry}:${EUREKA_PORT:8761}/eureka/
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    metadata-map:
      environment: docker

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: docker

logging:
  level:
    root: INFO
    com.careeros: DEBUG
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

# AWS S3 Configuration (injected via docker-compose env)
aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET:careeros-local}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY:local-dev}
    secret-key: ${AWS_SECRET_KEY:local-dev}
    endpoint: ${AWS_S3_ENDPOINT:http://localstack:4566}  # For local dev with LocalStack

# CareerOS App Config
careeros:
  security:
    jwt:
      secret: ${JWT_SECRET:careeros-super-secret-jwt-key-minimum-256-bits-long-for-hs256}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours
      refresh-expiration-ms: ${JWT_REFRESH_MS:604800000} # 7 days
  ai:
    agent-url: http://${AI_AGENT_HOST:ai-agent}:${AI_AGENT_PORT:8000}
    enabled: true
