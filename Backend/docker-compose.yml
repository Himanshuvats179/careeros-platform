name: careeros

services:
  postgres:
    image: postgres:16-alpine
    container_name: careeros-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - careeros-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: careeros-prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - careeros-network

  loki:
    image: grafana/loki:3.5.3
    container_name: careeros-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT}:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - careeros-network

  tempo:
    image: grafana/tempo:2.7.2
    container_name: careeros-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "${TEMPO_PORT}:3200"
      - "${TEMPO_OTLP_HTTP_PORT}:4318"
      - "${TEMPO_OTLP_GRPC_PORT}:4317"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - careeros-network

  grafana:
    image: grafana/grafana:12.0.2
    container_name: careeros-grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - careeros-network

  alloy:
    image: grafana/alloy:v1.8.3
    container_name: careeros-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./auth-service/logs:/logs:ro
    depends_on:
      - loki
    networks:
      - careeros-network

networks:
  careeros-network:
    name: ${DOCKER_NETWORK}
    driver: bridge

volumes:
  postgres_data:
  loki_data:
  tempo_data:
  grafana_data: