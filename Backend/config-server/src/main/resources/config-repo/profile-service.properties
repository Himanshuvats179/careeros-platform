server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5433/careeros
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoint.health.probes.enabled=true

# ===============================
# Actuator / Prometheus
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ===============================
# Distributed tracing
# ===============================
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

# ===========================
# LOGGING
# ===========================

logging.file.name=logs/profile-service.log

logging.logback.rollingpolicy.file-name-pattern=logs/profile-service.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=500MB

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [thread=%thread,id=%tid] [traceId=%X{traceId:-},spanId=%X{spanId:-}] %logger{36} - %msg%n

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [thread=%thread,id=%tid] [traceId=%X{traceId:-},spanId=%X{spanId:-}] %logger{36} - %msg%n

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

