# ===============================
# APPLICATION
# ===============================
spring.application.name=notification-service

server.port=8082

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5433/notification_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ===============================
# EUREKA
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ===============================
# ACTUATOR
# ===============================
management.endpoint.health.probes.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ===============================
# DISTRIBUTED TRACING
# ===============================
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

# ===============================
# LOGGING
# ===============================
logging.file.name=logs/notification-service.log

logging.logback.rollingpolicy.file-name-pattern=logs/notification-service.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=500MB

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [thread=%thread,id=%tid] [traceId=%X{traceId:-},spanId=%X{spanId:-}] %logger{36} - %msg%n

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [thread=%thread,id=%tid] [traceId=%X{traceId:-},spanId=%X{spanId:-}] %logger{36} - %msg%n

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# RABBITMQ
# ===============================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=careeros
spring.rabbitmq.password=careeros123

spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=5

# ==========================================
# RabbitMQ Configuration
# ==========================================

rabbitmq.exchange=careeros.events

rabbitmq.queue.notification.email=notification.email.queue

rabbitmq.routing-key.user-registered=user.registered

# ==========================================
# Mail Configuration
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
