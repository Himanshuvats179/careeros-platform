# =============================================================================
# CareerOS — Full Production Docker Compose
# =============================================================================
# Usage:
#   docker compose up -d                 # Start all services
#   docker compose up -d infra           # Start infra only
#   docker compose logs -f auth-service  # Tail logs
#   docker compose down -v               # Stop & remove volumes
#
# Startup order (enforced by depends_on / healthchecks):
#   Infrastructure (postgres, redis, kafka, rabbitmq, mailpit)
#     → config-server
#       → service-registry
#         → All microservices
#           → api-gateway
#             → frontend
# =============================================================================

name: careeros

# ─────────────────────────────────────────────
# Shared extension anchors
# ─────────────────────────────────────────────
x-java-service: &java-defaults
  restart: unless-stopped
  networks:
    - careeros-network
  environment:
    SPRING_PROFILES_ACTIVE: docker
    SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: 6379
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SPRING_RABBITMQ_HOST: rabbitmq
    SPRING_RABBITMQ_PORT: 5672
    SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
    SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

x-infra-healthcheck: &infra-ready
  condition: service_healthy

# ─────────────────────────────────────────────
services:

  # ===========================================================================
  # INFRASTRUCTURE LAYER
  # ===========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: careeros-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - careeros-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: careeros-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@careeros.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - careeros-network
    restart: unless-stopped
    depends_on:
      postgres:
        *infra-ready

  redis:
    image: redis:7-alpine
    container_name: careeros-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - careeros-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: careeros-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - careeros-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: careeros-kafka
    depends_on:
      zookeeper:
        *infra-ready
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - careeros-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: careeros-kafka-ui
    depends_on:
      kafka:
        *infra-ready
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: careeros-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - careeros-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: careeros-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - careeros-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    container_name: careeros-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - careeros-network
    restart: unless-stopped

  # ===========================================================================
  # PLATFORM LAYER: Config Server & Service Registry
  # ===========================================================================

  config-server:
    build:
      context: ./Backend
      dockerfile: config-server/Dockerfile
    image: careeros/config-server:latest
    container_name: careeros-config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8888
    networks:
      - careeros-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  service-registry:
    build:
      context: ./Backend
      dockerfile: service-registry/Dockerfile
    image: careeros/service-registry:latest
    container_name: careeros-service-registry
    depends_on:
      config-server:
        *infra-ready
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8761
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
    networks:
      - careeros-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ===========================================================================
  # MICROSERVICES LAYER
  # ===========================================================================

  auth-service:
    build:
      context: ./Backend
      dockerfile: auth-service/Dockerfile
    image: careeros/auth-service:latest
    container_name: careeros-auth-service
    <<: *java-defaults
    depends_on:
      postgres:
        *infra-ready
      redis:
        *infra-ready
      rabbitmq:
        *infra-ready
      config-server:
        *infra-ready
      service-registry:
        *infra-ready
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: auth-service
      JWT_SECRET: ${JWT_SECRET:-careeros-super-secret-key-change-in-production-256-bit}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  profile-service:
    build:
      context: ./Backend
      dockerfile: profile-service/Dockerfile
    image: careeros/profile-service:latest
    container_name: careeros-profile-service
    <<: *java-defaults
    depends_on:
      postgres:
        *infra-ready
      redis:
        *infra-ready
      kafka:
        *infra-ready
      config-server:
        *infra-ready
      service-registry:
        *infra-ready
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: profile-service
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # AWS S3 (optional — comment out if not using AWS)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-careeros-profiles}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  notification-service:
    build:
      context: ./Backend
      dockerfile: notification-service/Dockerfile
    image: careeros/notification-service:latest
    container_name: careeros-notification-service
    <<: *java-defaults
    depends_on:
      postgres:
        *infra-ready
      rabbitmq:
        *infra-ready
      kafka:
        *infra-ready
      config-server:
        *infra-ready
      service-registry:
        *infra-ready
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_APPLICATION_NAME: notification-service
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: noreply@careeros.com
      SPRING_MAIL_PASSWORD: ""
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  audit-service:
    build:
      context: ./Backend
      dockerfile: audit-service/Dockerfile
    image: careeros/audit-service:latest
    container_name: careeros-audit-service
    <<: *java-defaults
    depends_on:
      postgres:
        *infra-ready
      kafka:
        *infra-ready
      config-server:
        *infra-ready
      service-registry:
        *infra-ready
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_APPLICATION_NAME: audit-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  job-service:
    build:
      context: ./Backend
      dockerfile: job-service/Dockerfile
    image: careeros/job-service:latest
    container_name: careeros-job-service
    <<: *java-defaults
    depends_on:
      postgres:
        *infra-ready
      redis:
        *infra-ready
      kafka:
        *infra-ready
      rabbitmq:
        *infra-ready
      config-server:
        *infra-ready
      service-registry:
        *infra-ready
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_APPLICATION_NAME: job-service
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ai-agent:
    build:
      context: ./AI-Agent
      dockerfile: Dockerfile
    image: careeros/ai-agent:latest
    container_name: careeros-ai-agent
    depends_on:
      - service-registry
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8001
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      AUTH_SERVICE_URL: http://auth-service:8080
      PROFILE_SERVICE_URL: http://profile-service:8081
      JOB_SERVICE_URL: http://job-service:8084
      # AWS S3 for resume storage
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-careeros-resumes}
    networks:
      - careeros-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  chromadb:
    image: chromadb/chroma:latest
    container_name: careeros-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    networks:
      - careeros-network
    restart: unless-stopped

  # ===========================================================================
  # API GATEWAY (entry point for all client traffic)
  # ===========================================================================

  api-gateway:
    build:
      context: ./Backend
      dockerfile: api-gateway/Dockerfile
    image: careeros/api-gateway:latest
    container_name: careeros-api-gateway
    <<: *java-defaults
    depends_on:
      redis:
        *infra-ready
      config-server:
        *infra-ready
      service-registry:
        *infra-ready
      auth-service:
        *infra-ready
    ports:
      - "8443:8443"
    environment:
      SERVER_PORT: 8443
      SPRING_APPLICATION_NAME: api-gateway
      JWT_SECRET: ${JWT_SECRET:-careeros-super-secret-key-change-in-production-256-bit}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8443/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # FRONTEND
  # ===========================================================================

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    image: careeros/frontend:latest
    container_name: careeros-frontend
    depends_on:
      - api-gateway
    ports:
      - "3001:80"
    networks:
      - careeros-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # OBSERVABILITY STACK (Prometheus + Grafana + Loki + Tempo + Alloy)
  # ===========================================================================

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: careeros-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./Backend/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - careeros-network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.3
    container_name: careeros-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./Backend/observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - careeros-network
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.2
    container_name: careeros-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
    volumes:
      - ./Backend/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    networks:
      - careeros-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    container_name: careeros-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./Backend/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./Backend/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - careeros-network
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.8.3
    container_name: careeros-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "12345:12345"
    volumes:
      - ./Backend/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - loki
    networks:
      - careeros-network
    restart: unless-stopped

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  careeros-network:
    name: ${DOCKER_NETWORK:-careeros-network}
    driver: bridge

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  rabbitmq_data:
  chromadb_data:
  loki_data:
  tempo_data:
  grafana_data:
