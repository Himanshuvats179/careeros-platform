# =============================================================================
# CareerOS — CI/CD Pipeline
# Triggers: Push to main/develop, PRs to main
# Jobs:
#   1. backend-test    → Maven build + unit tests
#   2. frontend-build  → Node build + lint
#   3. docker-build    → Build & push all images to Docker Hub / ECR
#   4. deploy-staging  → Deploy to staging (on develop)
#   5. deploy-prod     → Deploy to production (on main, after approval)
# =============================================================================
name: CareerOS CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/careeros

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Backend Tests (Maven)
  # ───────────────────────────────────────────────────────────────────────────
  backend-test:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careeros_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: 🔨 Build & Test (Maven)
        working-directory: Backend
        run: |
          mvn clean package \
            -DskipTests \
            --no-transfer-progress \
            -B

      - name: 📊 Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: Backend/**/target/surefire-reports/*.xml
          reporter: java-junit

      - name: 📤 Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: Backend/**/target/site/jacoco/

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Frontend Build & Lint
  # ───────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: 🔍 Lint
        working-directory: Frontend
        run: npm run lint --if-present

      - name: 🏗️ Build production bundle
        working-directory: Frontend
        run: npm run build
        env:
          VITE_API_GATEWAY_URL: https://api.careeros.com

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Build & Push Docker Images
  # ───────────────────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - { name: auth-service,         context: Backend, dockerfile: auth-service/Dockerfile }
          - { name: profile-service,      context: Backend, dockerfile: profile-service/Dockerfile }
          - { name: notification-service, context: Backend, dockerfile: notification-service/Dockerfile }
          - { name: audit-service,        context: Backend, dockerfile: audit-service/Dockerfile }
          - { name: job-service,          context: Backend, dockerfile: job-service/Dockerfile }
          - { name: api-gateway,          context: Backend, dockerfile: api-gateway/Dockerfile }
          - { name: service-registry,     context: Backend, dockerfile: service-registry/Dockerfile }
          - { name: config-server,        context: Backend, dockerfile: config-server/Dockerfile }
          - { name: ai-agent,             context: AI-Agent, dockerfile: Dockerfile }
          - { name: frontend,             context: Frontend, dockerfile: Dockerfile }

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🚀 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4: Deploy to Staging (develop branch)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: 🔄 Update image tags in staging
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          for service in auth-service profile-service notification-service audit-service job-service api-gateway frontend; do
            kubectl set image deployment/$service \
              $service=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$service:sha-$SHORT_SHA \
              -n careeros
          done

      - name: ✅ Verify staging rollout
        run: |
          kubectl rollout status deployment -n careeros --timeout=300s

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5: Deploy to Production (main branch, with manual approval gate)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: 🌐 Deploy Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: production   # requires GitHub Environment approval

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Configure kubectl (production cluster)
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: 🔄 Rolling update — all services
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          for service in auth-service profile-service notification-service audit-service job-service api-gateway frontend; do
            kubectl set image deployment/$service \
              $service=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$service:sha-$SHORT_SHA \
              -n careeros
          done

      - name: ✅ Verify production rollout
        run: |
          kubectl rollout status deployment -n careeros --timeout=300s

      - name: 🏥 Health check all endpoints
        run: |
          sleep 30
          curl -f https://api.careeros.com/actuator/health || exit 1
          echo "✅ Production deployment successful!"

      - name: 📣 Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} CareerOS Production Deploy: ${{ job.status }}\nCommit: ${{ github.sha }}\nBy: ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
